name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: npm run security:secrets

      - name: Validate product data
        run: npm run products:validate

      - name: Preview safe simple SKU merge
        run: npm run products:simple:preview

      - name: Check product images
        run: npm run products:check-images

      - name: Verify generated product files
        run: |
          npm run products:import
          npm run products:report
          git diff --exit-code -- lib/data/products.ts docs/product-readiness-report.md

      - name: Verify promotion campaign links
        run: |
          npm run promotion:check
          npm run promotion:test

      - name: Audit SEO content
        run: npm run seo:audit

      - name: Test RFQ constraints
        run: npm run test:rfq

      - name: Test product catalog search
        run: npm run test:product-search

      - name: Test MIG/MAG torch parts RFQ builder
        run: npm run test:mig-rfq

      - name: Test OEM RFQ builder
        run: npm run test:oem-rfq

      - name: Test distributor RFQ builder and workbook
        run: npm run test:distributor-rfq

      - name: Test plasma consumables RFQ builder
        run: npm run test:plasma-rfq

      - name: Test TIG torch parts RFQ builder
        run: npm run test:tig-rfq

      - name: Test welding machine RFQ builder
        run: npm run test:machine-rfq

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit search snippets and social preview
        run: npm run seo:snippets

      - name: Check performance budgets
        run: npm run performance:budget
